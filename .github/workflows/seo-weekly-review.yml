name: Weekly SEO Review

on:
  schedule:
    - cron: '23 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: seo-weekly-review
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read the latest completed collector run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/update-dashboard.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f status=completed -F per_page=1 \
            --jq '.workflow_runs[0] | {id, conclusion}' > "$RUNNER_TEMP/seo-collector-run.json"; then
            printf '{}\n' > "$RUNNER_TEMP/seo-collector-run.json"
            echo '::warning::Collector run metadata unavailable'
          fi
      - name: Prepare the review and checkpoint
        run: |
          python -B scripts/seo_workspace.py --data-dir data --output-dir "$RUNNER_TEMP/seo-review" \
            --checkpoint --collector-run "$RUNNER_TEMP/seo-collector-run.json"
          cat "$RUNNER_TEMP/seo-review/checkpoint.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\nReviewed repository revision `%s`.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: seo-weekly-review
          path: |
            ${{ runner.temp }}/seo-review/checkpoint.md
            ${{ runner.temp }}/seo-review/weekly-review.md
            ${{ runner.temp }}/seo-review/roast-roadmap.md
            ${{ runner.temp }}/seo-review/blitz-plan.md
          if-no-files-found: error
          retention-days: 90
