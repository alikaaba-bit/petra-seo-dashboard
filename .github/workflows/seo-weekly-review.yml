name: Weekly SEO Review

on:
  schedule:
    - cron: '23 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: seo-weekly-review
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt
      - name: Test the decision and measurement rules
        run: python -B -m unittest discover -s tests
      - name: Validate inputs and produce the next decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/seo_review_cycle.py --data-dir data --output-dir "$RUNNER_TEMP/seo-review" \
            --github-repository "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"
          cat "$RUNNER_TEMP/seo-review/checkpoint.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\nReviewed repository revision `%s`.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: seo-weekly-review
          path: |
            ${{ runner.temp }}/seo-review/checkpoint.md
            ${{ runner.temp }}/seo-review/review-state.json
            ${{ runner.temp }}/seo-review/weekly-review.md
            ${{ runner.temp }}/seo-review/roast-roadmap.md
            ${{ runner.temp }}/seo-review/blitz-plan.md
          if-no-files-found: error
          retention-days: 90
